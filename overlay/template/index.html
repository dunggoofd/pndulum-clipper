<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "GCHook"; font-weight: 400; src: url("assets/fonts/Anton-400.woff2") format("woff2"); }
      @font-face { font-family: "GCCap"; font-weight: 100 900; src: url("assets/fonts/Montserrat-VF.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; background: transparent; }
      .emo { -webkit-text-stroke: 0; font-family: "Apple Color Emoji"; font-size: 0.82em; line-height: 0; vertical-align: 0.06em; }
      .stroke {
        paint-order: stroke fill;
        -webkit-text-stroke: 14px #000;
        text-shadow: 0 8px 0 #000, 0 10px 28px rgba(0, 0, 0, 0.55);
      }
      #hook-box {
        position: absolute; left: 140px; top: 180px; width: 800px; height: 240px;
        display: flex; align-items: center; justify-content: center;
      }
      #hook {
        font-family: "GCHook", "Apple Color Emoji", sans-serif; font-weight: 400; color: #fff;
        text-align: center; text-transform: uppercase; line-height: 1.02; letter-spacing: 0.01em;
        width: 800px;
      }
      #caps { position: absolute; left: 140px; top: 1240px; width: 800px; height: 160px; }
      .card {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        opacity: 0;
      }
      .card-in {
        font-family: "GCCap", sans-serif; font-weight: 900; color: #fff; text-align: center;
        text-transform: uppercase; line-height: 1.05; width: 800px;
      }
      .card-in span { display: inline-block; margin: 0 0.12em; }
      #handle {
        position: absolute; left: 60px; top: 1500px;
        font-family: "GCCap", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.78); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }
      #kick {
        position: absolute; left: 0; top: 600px; width: 1080px; height: 112px; background: #000;
        display: none; align-items: center;
      }
      #kick img { position: absolute; left: 60px; top: -14px; height: 96px; }
      #kick-url {
        position: absolute; left: 380px; right: 0; top: 0; height: 112px;
        display: flex; align-items: center; justify-content: center;
        font-family: "GCHook", sans-serif; font-size: 54px; color: #fff; text-transform: uppercase; letter-spacing: 0.01em;
      }
      #chat {
        position: absolute; left: 60px; top: 790px; width: 620px; height: 420px; opacity: 0;
        border-radius: 24px; background: rgba(12, 12, 14, 0.66); overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end; padding: 18px 24px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 64px);
      }
      #chat-list { display: flex; flex-direction: column; gap: 10px; }
      .msg {
        display: none; font-family: "GCCap", "Apple Color Emoji", sans-serif; font-weight: 700; font-size: 31px;
        line-height: 1.22; color: #fff; overflow-wrap: anywhere; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }
      .msg b { font-weight: 900; }
      #chat-list.clear .msg { text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 14px rgba(0, 0, 0, 0.6); }
      #measure { position: absolute; left: -5000px; top: 0; visibility: hidden; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920" data-fps="30">
      <div id="hook-box" class="clip" data-start="0" data-duration="20" data-track-index="1"><div id="hook" class="stroke"></div></div>
      <div id="caps" class="clip" data-start="0" data-duration="20" data-track-index="2"></div>
      <div id="kick" class="clip" data-start="0" data-duration="20" data-track-index="4"><img src="assets/kick-logo.svg" alt=""><div id="kick-url"></div></div>
      <div id="handle" class="clip" data-start="0" data-duration="20" data-track-index="3"></div>
      <div id="chat" class="clip" data-start="0" data-duration="20" data-track-index="5"><div id="chat-list"></div></div>
      <div id="measure"></div>
    </div>
    <script id="clip-data" type="application/json">{"duration":20,"hook":"XQC LOSES IT AT THE FIRST HEIST","streamer":"xQc","words":[{"w":"bro","s":1.0,"e":1.3},{"w":"what","s":1.4,"e":1.6},{"w":"is","s":1.65,"e":1.8},{"w":"that","s":1.85,"e":2.2}]}</script>

    <script>
      const CLIP = JSON.parse(document.getElementById("clip-data").textContent);
      const YELLOW = "#FFE14D";
      const BOX_W = 800;
      const GAP_HIDE = 0.8;
      const MAX_WORDS = 3;
      const MAX_CHARS = 20;

      function cardsFrom(words) {
        const cards = [];
        let cur = [];
        const flush = () => { if (cur.length) { cards.push(cur); cur = []; } };
        words.forEach((w, i) => {
          const chars = cur.reduce((n, x) => n + x.w.length + 1, 0) + w.w.length;
          if (cur.length && (cur.length >= MAX_WORDS || chars > MAX_CHARS)) flush();
          cur.push(w);
          const next = words[i + 1];
          if (/[.!?]$/.test(w.w) || (next && next.s - w.e > 0.35)) flush();
        });
        flush();
        return cards;
      }

      function fitHook(el, text) {
        const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        el.innerHTML = esc(text).replace(/(\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic}|\ufe0f|\p{Emoji_Modifier})*)/gu, '<span class="emo">$1</span>');
        const m = document.getElementById("measure");
        let size = 118;
        for (; size > 40; size -= 2) {
          el.style.fontSize = size + "px";
          if (el.getBoundingClientRect().height <= 2 * size * 1.02 + 2 && el.scrollWidth <= BOX_W) {
            const words = text.split(/\s+/);
            m.style.cssText = "font-family:GCHook,'Apple Color Emoji';text-transform:uppercase;font-size:" + size + "px;letter-spacing:0.01em";
            if (words.every((w) => { m.textContent = w; return m.getBoundingClientRect().width <= BOX_W - 20; })) break;
          }
        }
        el.style.fontSize = size + "px";
      }

      function fitCard(inner) {
        let size = 104;
        for (; size > 64; size -= 4) {
          inner.style.fontSize = size + "px";
          if (inner.getBoundingClientRect().height <= size * 1.05 + 2) break;
        }
        inner.style.fontSize = size + "px";
      }

      Promise.all([document.fonts.load('400 100px "GCHook"'), document.fonts.load('900 100px "GCCap"')]).then(() => {
        const dur = CLIP.duration;
        const tl = gsap.timeline({ paused: true });

        const hook = document.getElementById("hook");
        if (CLIP.hook_y != null) document.getElementById("hook-box").style.top = CLIP.hook_y + "px";
        fitHook(hook, CLIP.hook || "");
        tl.fromTo(hook, { scale: 0.8 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, 0);

        const handle = CLIP.handle != null ? CLIP.handle : "@" + String(CLIP.streamer || "").toLowerCase().replace(/\s+/g, "");
        document.getElementById("handle").textContent = CLIP.streamer && !CLIP.kick ? handle : "";
        if (CLIP.kick) {
          const k = document.getElementById("kick");
          k.style.display = "flex";
          if (CLIP.logo) { const im = k.querySelector("img"); im.src = CLIP.logo; if (!CLIP.logo.includes("kick")) im.style.top = "8px"; }
          if (CLIP.kick_y != null) k.style.top = CLIP.kick_y + "px";
          document.getElementById("kick-url").textContent = String(CLIP.kick).replace(/^https?:\/\//, "").replace(/\/$/, "");
        }

        if (CLIP.chat && CLIP.chat.msgs && CLIP.chat.msgs.length) {
          const box = document.getElementById("chat");
          const list = document.getElementById("chat-list");
          if (CLIP.chat_y != null) box.style.top = CLIP.chat_y + "px";
          if (CLIP.chat_h != null) box.style.height = CLIP.chat_h + "px";
          if (CLIP.chat_clear) { box.style.background = "none"; box.style.borderRadius = "0"; list.classList.add("clear"); }
          const NAME_COLORS = ["#FF5A5A", "#5BA8FF", "#3DDC84", "#FF9A3D", "#C77DFF", "#FFD23F", "#2EE6D6", "#FF6FB5"];
          const color = (u) => NAME_COLORS[[...u].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % NAME_COLORS.length];
          const cin = Math.max(0, CLIP.chat.in), cout = Math.min(dur, CLIP.chat.out);
          tl.set(box, { opacity: 0 }, 0);
          tl.fromTo(box, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.28, ease: "power2.out" }, cin);
          tl.to(box, { opacity: 0, duration: 0.3 }, Math.max(cin + 0.3, cout - 0.3));
          CLIP.chat.msgs.forEach((m) => {
            const el = document.createElement("div");
            el.className = "msg";
            const b = document.createElement("b");
            b.textContent = m.u + ": ";
            b.style.color = color(String(m.u));
            el.appendChild(b);
            el.appendChild(document.createTextNode(m.m));
            list.appendChild(el);
            const t = Math.max(cin, m.t);
            tl.set(el, { display: "block" }, t);
            if (t > cin) tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: "power1.out" }, t);
          });
        }

        const words = (CLIP.words || []).filter((w) => w.s < dur).map((w) => ({ w: String(w.w), s: w.s, e: Math.min(w.e, dur) }));
        const groups = cardsFrom(words);
        const caps = document.getElementById("caps");
        groups.forEach((g, gi) => {
          const card = document.createElement("div");
          card.className = "card";
          const inner = document.createElement("div");
          inner.className = "card-in stroke";
          const spans = g.map((w) => {
            const sp = document.createElement("span");
            sp.textContent = w.w;
            inner.appendChild(sp);
            return sp;
          });
          card.appendChild(inner);
          caps.appendChild(card);
          fitCard(inner);

          const start = g[0].s;
          const last = g[g.length - 1];
          const nextStart = groups[gi + 1] ? groups[gi + 1][0].s : null;
          let end = last.e + 0.12;
          if (nextStart !== null && nextStart - last.e <= GAP_HIDE) end = nextStart;
          end = Math.min(end, dur);

          tl.set(card, { opacity: 1 }, start);
          tl.fromTo(inner, { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "back.out(2.4)" }, start);
          g.forEach((w, wi) => {
            const wEnd = wi < g.length - 1 ? g[wi + 1].s : end;
            tl.set(spans[wi], { color: YELLOW }, w.s);
            tl.set(spans[wi], { color: "#ffffff" }, wEnd);
          });
          tl.set(card, { opacity: 0 }, end);
        });

        (CLIP.focus || []).forEach((f) => {
          ["hook-box", "chat", "kick"].forEach((id) => {
            const el = document.getElementById(id);
            tl.set(el, { scale: 0 }, f.in);
            if (f.out < dur) tl.set(el, { scale: 1 }, f.out);
          });
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
